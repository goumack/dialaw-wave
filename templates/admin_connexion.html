{% extends "base.html" %}
{% block titre %}Back-office{% endblock %}

{% block contenu %}

<section class="carte carte--formulaire carte--centre">
  <h1>Back-office Dialaw TV</h1>
  <p class="carte-texte">Réservé à l'équipe.</p>

  <form method="post" class="formulaire">
    <label for="email">Adresse e-mail</label>
    <input type="email" id="email" name="email" required autocomplete="username"
           placeholder="admin@dialawtv.sn">

    <label for="mot_de_passe">Mot de passe</label>
    <input type="password" id="mot_de_passe" name="mot_de_passe" required
           autocomplete="current-password">

    <button type="submit" class="bouton bouton--principal bouton--large">
      Se connecter
    </button>
  </form>
</section>

{% endblock %}
