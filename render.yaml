# Déploiement Render — Dialaw TV Live
#
# Render lit ce fichier automatiquement à la création du service.
# Les valeurs marquées « sync: false » sont à saisir dans l'interface Render :
# elles ne doivent jamais figurer dans le dépôt Git.

services:
  - type: web
    name: dialawtv-live
    runtime: python
    plan: free
    region: frankfurt          # le plus proche du Sénégal parmi les régions gratuites
    buildCommand: pip install -r requirements.txt
    # Pas de --bind explicite : Render fournit $PORT à gunicorn, et un
    # « $PORT » non développé par le shell ferait écouter sur un port mort,
    # avec un service affiché « live » mais injoignable (x-render-routing:
    # no-server).
    #
    # ATTENTION — Render fige cette commande à la création du service et
    # ignore ensuite toute modification faite ici. Pour la changer sur un
    # service existant : Settings → Build & Deploy → Start Command.
    startCommand: gunicorn app:app --workers 2 --timeout 120 --log-file -

    # DATABASE_URL n'est pas déclarée ici : elle contient le mot de passe de
    # la base Neon et se saisit uniquement dans l'onglet Environment.

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Générée par Render, jamais visible dans le code
      - key: SECRET_KEY
        generateValue: true
      # À saisir dans l'onglet Environment de Render
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_MOT_DE_PASSE
        sync: false

# ---------------------------------------------------------------------------
# ATTENTION — le plan gratuit n'accepte pas de disque persistant.
#
# La base repart donc de zéro à chaque redéploiement : commandes, mots de
# passe distribués et réglages sont perdus. Acceptable pour tester, pas pour
# une soirée de vente réelle.
#
# Pour conserver vos données, passez le service en plan payant (Starter,
# environ 7 $/mois) et rétablissez les deux blocs ci-dessous :
#
#     plan: starter          (à la place de « plan: free »)
#
#     envVars:
#       - key: DATABASE_NAME
#         value: /var/data/dialaw_live.db
#
#     disk:
#       name: donnees
#       mountPath: /var/data
#       sizeGB: 1
# ---------------------------------------------------------------------------
